<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="screen-orientation" content="portrait">
<meta name="full-screen" content="yes">
<meta name="browsermode" content="application">
<meta name="x5-orientation" content="portrait">
<meta name="x5-fullscreen" content="true">
<meta name="x5-page-mode" content="app">
<meta name="theme-color" content="#e44d26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-orientations" content="portrait">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="all.min.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>MiniDonas</title>
</head>

<body>
<!-- Loading Screen -->
<div id="loading" class="loading-screen">
<div class="loading-content">
<div class="loading-logo">
<img id="logoImage" src="icon-512.png" alt="Logo" class="logoImage">
<!--i class="fas fa-shopping-bag"></i-->
</div>
<div class="loading-text">Iniciando aplicación...</div>
<div class="loading-progress">
<div class="progress-bar"></div>
</div>
<div class="loading-stats">
<span id="loadingStatus">Cargando...</span>
</div>
</div>
</div>

<!-- Mensaje de orientación -->
<div id="orientationMessage" class="orientation-message">
<div class="orientation-content">
<i class="fas fa-mobile-alt"></i>
<h3>Rotar Dispositivo</h3>
<p>Esta aplicación funciona solo en dispositivos móviles para modo vertical</p>
</div>
</div>

<!-- App Content -->
<div class="app" style="display: none;">
<header class="header">
<div class="logo">
<img id="logoImage" src="logo.png" alt="Logo">
</div>
<div class="header-buttons">
<button id="notificationsBtn" class="icon-button"><i class="fas fa-bell"></i></button>
<!-- button id="optionsBtn" class="icon-button"><i class="fas fa-cog"></i></button -->
</div>
</header>

<section class="banner-container">
<div id="banner" class="banner"></div>
</section>

<main class="main">
<div id="productsContainer" class="products-container">
<div class="skeleton-card">
<div class="skeleton-image"></div>
<div class="skeleton-text"></div>
<div class="skeleton-text short"></div>
<div class="skeleton-buttons"></div>
</div>
</div>
</main>

<button id="floatingMenuBtn" class="floating-button"><i class="fas fa-bars"></i></button>

<footer class="footer">
<div style="margin-right: 20px;display:flex;gap:1rem">
<a href="#" class="social-button"><i class="fab fa-facebook-f"></i></a>
<a href="#" class="social-button"><i class="fab fa-instagram"></i></a>
</div>
</footer>
</div>

<!-- Modal Personalizado -->
<div id="customModal" class="custom-modal">
<div class="modal-content">
<div class="modal-header">
<h3 id="modalTitle">Título</h3>
<button class="modal-close">&times;</button>
</div>
<div class="modal-body">
<p id="modalMessage">Mensaje</p>
</div>
<div class="modal-footer">
<button id="modalCancel" class="btn-secondary">Cancelar</button>
<button id="modalConfirm" class="btn-primary">Aceptar</button>
</div>
</div>
</div>

<!-- Alert Personalizado -->
<div id="customAlert" class="custom-alert">
<div class="alert-content">
<div class="alert-icon">
<i class="fas fa-info-circle"></i>
</div>
<div class="alert-message" id="alertMessage">Mensaje de alerta</div>
<button class="alert-close" id="alertClose">Aceptar</button>
</div>
</div>

<script src="app.js"></script>
</body>
</html>
